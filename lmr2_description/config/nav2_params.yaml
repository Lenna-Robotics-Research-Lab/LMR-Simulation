
# ============================================================
# LMR2 - ROS 2 Jazzy Navigation2 Parameters
# ============================================================

amcl:
  ros__parameters:
    use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true

# ============================================================
# BT Navigator
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    # Same base frame as the costmaps / SLAM (odom -> base_footprint -> base_link)
    robot_base_frame: base_footprint
    odom_topic: /lmr2/odom

    bt_loop_duration: 10
    default_server_timeout: 20

    # Silences the "Error_code parameters were not set" warning
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

# ============================================================
# Controller Server
# ============================================================

controller_server:
  ros__parameters:

    use_sim_time: true

    # Gazebo bridge expects geometry_msgs/Twist (not TwistStamped)
    enable_stamped_cmd_vel: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.20

      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5

      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08

      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.5

      transform_tolerance: 0.1

# ============================================================
# Local Planner / Controller Costmap
# ============================================================

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      # Initial conservative robot footprint
      footprint: "[[0.19, 0.11], [0.19, -0.11], [-0.15, -0.11], [-0.15, 0.11]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /lmr2/scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          obstacle_min_range: 0.20

          raytrace_max_range: 10.0
          raytrace_min_range: 0.20

          max_obstacle_height: 1.0

          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true

# ============================================================
# Global Planner Costmap
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 2.0
      publish_frequency: 1.0

      resolution: 0.05

      footprint: "[[0.19, 0.11], [0.19, -0.11], [-0.15, -0.11], [-0.15, 0.11]]"

      track_unknown_space: true

      plugins:
        ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /lmr2/scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          obstacle_min_range: 0.20

          raytrace_max_range: 10.0
          raytrace_min_range: 0.20

          max_obstacle_height: 1.0

          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.30

      always_send_full_costmap: true

# ============================================================
# Planner Server
# ============================================================

planner_server:
  ros__parameters:

    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.5

      use_astar: true

      allow_unknown: true

# ============================================================
# Behavior Server
# ============================================================

behavior_server:
  ros__parameters:

    use_sim_time: true

    enable_stamped_cmd_vel: false

    # Jazzy parameter names (costmap_topic / footprint_topic are pre-Jazzy)
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    # Jazzy: local_frame = odom, global_frame = map
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint

    transform_tolerance: 0.1

    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

# ============================================================
# Waypoint Follower
# ============================================================

waypoint_follower:
  ros__parameters:

    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: true
      waypoint_pause_duration: 1000

# ============================================================
# Velocity Smoother
# ============================================================

velocity_smoother:
  ros__parameters:

    use_sim_time: true

    enable_stamped_cmd_vel: false

    smoothing_frequency: 10.0

    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity: [1.0, 0.0, 1.57]
    min_velocity: [-0.5, 0.0, -1.57]

    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]

    odom_topic: /lmr2/odom

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

# ============================================================
# Collision Monitor
# ============================================================

collision_monitor:
  ros__parameters:

    use_sim_time: true

    enable_stamped_cmd_vel: false

    base_frame_id: base_footprint
    odom_frame_id: odom

    # Pipeline: controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
    #           -> collision_monitor -> /lmr2/cmd_vel -> ros_gz_bridge -> Gazebo DiffDrive
    # The collision monitor is the ONLY node that should publish to the robot topic,
    # so the output goes straight to /lmr2/cmd_vel here (no SetRemap in the launch file).
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /lmr2/cmd_vel

    state_topic: collision_monitor_state

    transform_tolerance: 0.2

    source_timeout: 0.5

    base_shift_correction: false

    stop_pub_timeout: 2.0

    polygons: ["StopZone"]

    StopZone:
      type: "circle"

      radius: 0.22

      action_type: "stop"

      min_points: 4

      visualize: true
      polygon_pub_topic: /lmr2/collision_monitor/stop_zone

      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"

      topic: /lmr2/scan

      min_height: 0.0
      max_height: 1.0

# ============================================================
# Docking Server  (opennav_docking)
# ------------------------------------------------------------
# REQUIRED: nav2_bringup/navigation_launch.py (Jazzy) always starts
# docking_server and adds it to lifecycle_manager_navigation. Without
# 'dock_plugins' it fails to configure ("Charging dock plugins not given!")
# and the lifecycle manager aborts the ENTIRE Nav2 bringup.
# The robot has no physical dock, so this is a minimal, inert configuration.
# ============================================================

docking_server:
  ros__parameters:

    use_sim_time: true

    enable_stamped_cmd_vel: false

    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3

    base_frame: base_footprint
    fixed_frame: odom

    dock_prestaging_tolerance: 0.5

    dock_plugins: ["simple_charging_dock"]

    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.10
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3